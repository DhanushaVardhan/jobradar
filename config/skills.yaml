# Skills taxonomy: category -> canonical skill -> aliases.
#
# Used by BOTH the Python pipeline and the website (exported to data/skills.json),
# so a resume pasted in the browser is parsed exactly like job descriptions are.
#
# Alias syntax:
#   plain text   case-insensitive, whole-word match; spaces also match "-" (e.g. "machine learning")
#   cs:Text      case-sensitive whole-word match (for words that are also common English: React, Spark)
#   re:regex     raw regular expression, case-sensitive (must be valid in both Python and JavaScript)
#   rei:regex    raw regular expression, case-insensitive

languages:
  Python: [python, python3]
  Java: [java, "cs:J2EE"]
  JavaScript: [javascript, "cs:JS", ecmascript, es6]
  TypeScript: [typescript]
  Go: [golang, 're:\bGo\b(?=\s*(?:,|/|\)|and\b|or\b|lang|programming|developers?\b|engineers?\b|microservices))']
  Rust: ["cs:Rust"]
  C++: ["c++", cpp]
  C#: ["c#", "csharp"]
  C: ['re:(?<!Series )\bC\b(?=\s*(?:/\s*C\+\+|,|and\b|or\b|programming|language))']
  Kotlin: [kotlin]
  Swift: ["cs:Swift", swiftui]
  Objective-C: [objective-c, "objective c"]
  Scala: [scala]
  PHP: [php]
  Ruby: ["cs:Ruby"]
