# JobRadar settings.
# Secrets (API keys, bot tokens, your resume) NEVER go in this file.
# They come from environment variables, which are GitHub Secrets in CI.

site:
  title: "JobRadar India"
  tagline: "Fresh jobs from top company career boards and remote job sites, summarized by AI and matched to your skills. Updated twice a day."
  # SITE_URL / REPO_URL env vars override these (the workflow sets them automatically)
  url: "https://dhanushavardhan.github.io/jobradar/"
  repo_url: "https://github.com/DhanushaVardhan/jobradar"
  # Optional: public Telegram channel people can join (e.g. https://t.me/jobradar_india)
  telegram_channel_url: ""

filters:
  # Which jobs to keep. india = located in India; remote_* = remote roles open to India / worldwide / APAC
  keep: [india, remote_india, remote_global, remote_apac]
  max_age_days: 30            # skip postings older than this when first seen

retention:
  close_after_missing_days: 5   # jobs from paged aggregators not seen for N days are marked closed
  delete_closed_after_days: 14  # closed jobs are deleted after N days
  delete_after_days: 60         # nothing older than this is kept

http:
  timeout: 30
  concurrency: 12
  per_host: 3
  user_agent: "JobRadar/1.0 (open-source job aggregator; +https://github.com/DhanushaVardhan/jobradar)"

sources:
  greenhouse: { enabled: true }
  lever: { enabled: true }
  ashby: { enabled: true }
  smartrecruiters: { enabled: true, country: in, max_details: 40 }
  himalayas: { enabled: true, country: IN, max_pages: 8, max_age_days: 4 }
  # Remotive advises at most 4 calls a day: 6 hours apart keeps that even with retries
  remotive: { enabled: true, min_interval_hours: 6 }
  remoteok: { enabled: true }
  jobicy: { enabled: true, count: 100 }
  # Adzuna needs a free key (ADZUNA_APP_ID / ADZUNA_APP_KEY). It is skipped when the key is missing.
  adzuna:
    enabled: true
    country: in
    max_calls: 16
    max_days_old: 3
    results_per_page: 50
    queries:
      - software engineer
      - python developer
      - data analyst
      - data scientist
      - machine learning engineer
      - frontend developer
      - devops engineer
      - graduate engineer trainee

llm:
  # Hard cap across all providers per UTC day (Groq free tier is ~1000 requests/day per model).
  daily_request_cap: 700
  enrich_max_per_run: 200     # jobs sent to the LLM per run; the rest keep the rule-based result
  enrich_batch_size: 5        # jobs per LLM request (saves requests and tokens)
  excerpt_chars: 1200         # description characters sent per job (requirements section first)
  time_budget_minutes: 15     # stop LLM enrichment after this long (free tiers are slow per minute)
  safety_margin: 0.9          # use at most 90% of each model's published daily limits
  providers:
    - name: groq-oss-20b
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      model: openai/gpt-oss-20b
      limits: { rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000 }
      params: { reasoning_effort: low, include_reasoning: false }
    - name: groq-qwen
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      model: qwen/qwen3.8-27b
      limits: { rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000 }
      params: { reasoning_effort: none, reasoning_format: hidden }
    - name: groq-oss-120b
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      model: openai/gpt-oss-120b
      limits: { rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000 }
      params: { reasoning_effort: low, include_reasoning: false }
    - name: gemini-flash-lite
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GEMINI_API_KEY
      model: gemini-3.5-flash-lite   # check https://ai.google.dev/gemini-api/docs/models for current free models
      limits: { rpm: 10, rpd: 500, tpm: 200000, tpd: 3000000 }
      params: {}
  # Provider preference per task. The first provider with a key and quota left wins.
  tasks:
    enrich: [groq-oss-20b, groq-qwen, gemini-flash-lite]
    match: [groq-oss-120b, groq-oss-20b, gemini-flash-lite]

match:
  ai_top_k: 20        # best rule-based candidates sent to the LLM for a resume-fit score
  ai_batch_size: 3
  min_score: 40       # rule-based score threshold to be considered at all
  digest_size: 12     # jobs in your daily Telegram digest

notify:
  telegram:
    owner_digest: true
    # The digest is only sent by runs starting at these UTC hours (morning runs start 02:17-03:17 UTC, about 08:00 IST)
    digest_hours_utc: [2, 3]
    channel_posts_per_run: 8
    health_alert_after_failures: 3

feeds:
  top_skills: 40
  top_cities: 12
  items_per_feed: 50
